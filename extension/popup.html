<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>GCI Collect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1a2236;
      background: #f8f9fb;
    }

    /* ── Header ── */
    .header {
      background: #1a2236;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title { font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .header-sub   { font-size: 10px; opacity: .5; margin-top: 1px; }
    .btn-settings {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.5); font-size: 16px; padding: 2px 4px;
    }
    .btn-settings:hover { color: #fff; }

    /* ── Body ── */
    .body { padding: 12px; }

    /* ── Alert / status ── */
    .alert {
      padding: 8px 10px; border-radius: 6px; font-size: 12px;
      margin-bottom: 10px; line-height: 1.4;
    }
    .alert-warn  { background: #fff8e1; border: 1px solid #ffe082; color: #7c5800; }
    .alert-info  { background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; }
    .alert-error { background: #fce4ec; border: 1px solid #f48fb1; color: #880e4f; }

    /* ── Label / input ── */
    label { display: block; font-size: 10px; text-transform: uppercase;
            letter-spacing: .08em; color: #1a2236; opacity: .45; margin-bottom: 4px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 7px 10px; border-radius: 6px;
      border: 1px solid rgba(26,34,54,.2); font-size: 12px; outline: none;
      background: #fff;
    }
    input:focus { border-color: #1a2236; }

    /* ── Card list ── */
    .card-list {
      border: 1px solid rgba(26,34,54,.12); border-radius: 6px;
      max-height: 160px; overflow-y: auto; background: #fff;
      margin-bottom: 10px;
    }
    .card-item {
      padding: 7px 10px; cursor: pointer; border-bottom: 1px solid rgba(26,34,54,.06);
      transition: background .1s;
    }
    .card-item:last-child { border-bottom: none; }
    .card-item:hover  { background: rgba(26,34,54,.04); }
    .card-item.active { background: #1a2236; color: #fff; }
    .card-item.active .card-sub { color: rgba(255,255,255,.6); }
    .card-name { font-weight: 500; font-size: 12px; }
    .card-sub  { font-size: 10px; color: rgba(26,34,54,.45); margin-top: 1px; }
    .card-empty { padding: 12px; text-align: center; color: rgba(26,34,54,.4); font-size: 12px; }

    /* ── Buttons ── */
    .btn {
      display: block; width: 100%; padding: 9px 14px;
      border-radius: 6px; border: none; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: opacity .15s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary  { background: #1a2236; color: #fff; }
    .btn-primary:not(:disabled):hover { opacity: .85; }
    .btn-ghost    {
      background: none; border: 1px solid rgba(26,34,54,.2);
      color: rgba(26,34,54,.6); font-size: 11px; padding: 6px;
      margin-top: 6px;
    }
    .btn-ghost:hover { background: rgba(26,34,54,.05); }

    /* ── Result ── */
    .result {
      margin-top: 10px; padding: 8px 10px; border-radius: 6px;
      background: #e8f5e9; border: 1px solid #a5d6a7; font-size: 12px;
    }
    .result-row { display: flex; justify-content: space-between; }
    .result-val { font-weight: 600; color: #1b5e20; }

    /* ── Settings view ── */
    #settings-view { display: none; }
    .mt8 { margin-top: 8px; }
    .mt12 { margin-top: 12px; }
    .text-xs { font-size: 11px; color: rgba(26,34,54,.5); margin-top: 4px; line-height: 1.5; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .6s linear infinite; margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Progress ── */
    .progress { font-size: 11px; color: rgba(26,34,54,.5); margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div>
      <div class="header-title">GCI Collect</div>
      <div class="header-sub">Mercari 売切れ収集</div>
    </div>
    <button class="btn-settings" id="btn-toggle-settings" title="設定">⚙</button>
  </div>

  <!-- Main view -->
  <div class="body" id="main-view">
    <div id="page-alert"></div>

    <!-- Card search -->
    <div class="mt8" id="card-search-section">
      <label>カード検索</label>
      <input type="text" id="card-search" placeholder="カード名・レアリティ" autocomplete="off" />
    </div>

    <!-- Card list -->
    <div class="mt8" id="card-list-wrap">
      <div class="card-list" id="card-list">
        <div class="card-empty">キーワードを入力してください</div>
      </div>
    </div>

    <!-- Collect button -->
    <button class="btn btn-primary" id="btn-collect" disabled>
      収集する
    </button>
    <div class="progress" id="progress-text"></div>

    <!-- Result -->
    <div class="result" id="result" style="display:none">
      <div class="result-row">
        <span>取込件数</span><span class="result-val" id="res-saved">—</span>
      </div>
      <div class="result-row mt8">
        <span>自動承認</span><span class="result-val" id="res-auto">—</span>
      </div>
      <div class="result-row mt8">
        <span>スキップ</span><span class="result-val" id="res-skip">—</span>
      </div>
    </div>
  </div>

  <!-- Settings view -->
  <div class="body" id="settings-view">
    <label>API Key（CRON_SECRET）</label>
    <input type="password" id="api-key-input" placeholder="your-cron-secret" />
    <p class="text-xs">gci-data.com の Vercel 環境変数 CRON_SECRET を入力してください。</p>
    <button class="btn btn-primary mt12" id="btn-save-key">保存</button>
    <button class="btn btn-ghost" id="btn-cancel-settings">キャンセル</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
