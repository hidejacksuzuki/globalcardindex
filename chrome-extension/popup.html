<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 100px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1a1f36;
      background: #fff;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid #e8ecf0;
      background: #1a1f36;
      color: #fff;
    }
    .header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
    .header p  { font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; text-transform: uppercase; }

    .body { padding: 12px 14px; space-y: 8px; }

    label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; margin-bottom: 4px; margin-top: 10px; }

    input, select {
      width: 100%; padding: 6px 8px;
      border: 1px solid #d1d5db; border-radius: 4px;
      font-size: 12px; color: #1a1f36; background: #fff;
      outline: none;
    }
    input:focus, select:focus { border-color: #1a1f36; }

    .btn {
      display: block; width: 100%; padding: 8px 12px; margin-top: 12px;
      background: #1a1f36; color: #fff; border: none; border-radius: 4px;
      font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: 0.02em;
      text-align: center;
    }
    .btn:hover { background: #2d3452; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-secondary {
      background: transparent; color: #6b7280; border: 1px solid #d1d5db;
      margin-top: 6px;
    }
    .btn-secondary:hover { border-color: #1a1f36; color: #1a1f36; }

    .status {
      margin-top: 10px; padding: 8px 10px; border-radius: 4px;
      font-size: 11px; line-height: 1.5;
    }
    .status.ok  { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .status.info{ background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

    .count { font-weight: 700; font-size: 18px; display: block; }
    .count-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; }

    .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .count-box { background: #f8f9fa; border: 1px solid #e8ecf0; border-radius: 4px; padding: 8px; text-align: center; }

    .page-url { font-size: 10px; color: #9ca3af; margin-top: 6px; word-break: break-all; }

    .divider { border: none; border-top: 1px solid #e8ecf0; margin: 12px 0; }

    #settings-toggle { font-size: 10px; color: #9ca3af; text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 8px; }
    #settings-panel { display: none; margin-top: 8px; }
    #settings-panel.open { display: block; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>GCI eBay Collector</h1>
    <p>Global Card Index</p>
  </div>
</div>

<div class="body" id="main-body">

  <div id="not-ebay" style="display:none">
    <div class="status info">
      eBayの検索結果ページを開いてください。<br>
      <code style="font-size:10px">ebay.com/sch/i.html?...&LH_Sold=1</code>
    </div>
  </div>

  <div id="ebay-panel" style="display:none">
    <label>CardAlias</label>
    <select id="alias-select">
      <option value="">— 読み込み中 —</option>
    </select>

    <div id="alias-info" style="display:none; margin-top:6px; font-size:10px; color:#6b7280;"></div>

    <p class="page-url" id="page-url"></p>

    <div class="counts" id="preview-counts" style="display:none">
      <div class="count-box">
        <span class="count" id="cnt-found">0</span>
        <span class="count-label">Found</span>
      </div>
      <div class="count-box">
        <span class="count" id="cnt-auto">0</span>
        <span class="count-label">Auto-import</span>
      </div>
    </div>

    <button class="btn" id="scrape-btn">このページを解析 &amp; 送信</button>

    <div id="status-box" style="display:none" class="status"></div>

    <hr class="divider">
    <span id="settings-toggle">⚙ 設定</span>
    <div id="settings-panel">
      <label>GCI API Base URL</label>
      <input type="url" id="api-base" placeholder="https://data.globalcardindex.com" />
      <label>API Key (CRON_SECRET)</label>
      <input type="password" id="api-key" placeholder="sk-..." />
      <button class="btn btn-secondary" id="save-settings">保存</button>
    </div>
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
