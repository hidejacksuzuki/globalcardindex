<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCI Importer 設定</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      width: 320px;
      padding: 16px;
      background: #fff;
      color: #1a1a2e;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #1a1a2e;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 4px;
      margin-top: 12px;
    }
    input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      color: #1a1a2e;
      outline: none;
    }
    input:focus { border-color: #1a1a2e; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 9px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #2d2d4e; }
    .msg {
      margin-top: 10px;
      font-size: 12px;
      color: #27ae60;
      text-align: center;
    }
    .msg.error { color: #e74c3c; }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #999;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>GCI Importer</h1>

  <label>API URL</label>
  <input type="url" id="apiUrl" placeholder="https://gci-data-xxx.vercel.app" />
  <p class="hint">gci-data の Vercel URL を入力</p>

  <label>CRON_SECRET</label>
  <input type="password" id="cronSecret" placeholder="your-cron-secret" />
  <p class="hint">Vercel の環境変数 CRON_SECRET と同じ値</p>

  <button id="save">保存</button>
  <div id="msg" class="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
